name: Update Kindle screensaver

on:
  schedule:
    - cron: "5 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-screensaver
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium and system dependencies
        run: python -m playwright install chromium --with-deps

      - name: Generate screensaver
        run: python generate.py

      - name: Commit and push updated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screensaver.png
          if git diff --cached --quiet; then
            echo "screensaver.png is unchanged."
          else
            git commit -m "Update screensaver"
            git push origin HEAD:main
          fi
